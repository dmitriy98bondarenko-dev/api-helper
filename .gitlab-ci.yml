stages:
  - build
  - deploy

# copies static files into the artifacts folder
build:
  stage: build
  image: alpine:latest
  script:
    - echo "Building static app..."
    - mkdir -p public
    - cp -r index.html css js data icons public/
  artifacts:
    paths:
      - public
    expire_in: 1 week
  tags:
    - aws-docker-arm

# Deploy to GitLab Pages
pages:
  stage: deploy
  dependencies:
    - build
  script:
    - echo "Deploying page..."
  artifacts:
    paths:
      - public
  needs:
    - job: build
  only:
    - main
  tags:
    - aws-docker-arm